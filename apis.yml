name: QurAlis
image: https://www.quralis.com/wp-content/uploads/2024/04/Quralis_Square_ogThumbnail_Royal_Blue_RGB.png
description: >-
  QurAlis Corporation is a clinical-stage biotechnology company founded on December 12, 2016 in
  Cambridge, Massachusetts by Drs. Kasper Roet, Kevin Eggan and Clifford Woolf together with Q-State
  Biosciences, and staffed by neurodegenerative biologists out of Harvard Medical School and Harvard
  University. The company develops precision medicines for amyotrophic lateral sclerosis (ALS),
  frontotemporal dementia (FTD) and other neurodegenerative and neurological diseases, built on the
  discovery — published in Nature Neuroscience by co-founder Kevin Eggan's lab — that loss of normal
  TDP-43 function drives a decrease in STATHMIN-2 (STMN2) expression and impairs neuronal repair. Its
  lead candidates are QRL-201, a first-in-class molecule intended to restore STMN2 expression in ALS
  (ANQUR trial), and QRL-101, a potentially best-in-class selective Kv7.2/7.3 ion channel opener for
  hyperexcitability-induced disease progression in ALS as well as epilepsy and pain; a third program
  targets UNC13A cryptic-exon mis-splicing. Therapies are built on the proprietary FlexASO®
  anti-sense oligonucleotide splice-modulator platform. QurAlis publishes a corporate site covering
  its story, pipeline, platform, people, patient resources, presentations and press releases, but
  runs no developer program: no API documentation, no SDKs, no developer portal, no GitHub
  organisation and no machine-readable API contract of any kind.
