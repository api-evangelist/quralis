cms_surface:
  note: >-
    The only machine-readable surface quralis.com exposes is its own WordPress CMS route index at
    /wp-json/. This is content-management infrastructure for the marketing site, not a developer
    product QurAlis offers, so it is recorded here for transparency but is NOT catalogued as an API
    and is NOT wired into apis.yml. robots.txt disallows only /wp-admin/, so the index itself is
    reachable — but nothing under it is a QurAlis API.
  url: https://www.quralis.com/wp-json/
  status: 200
